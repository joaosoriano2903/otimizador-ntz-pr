name: 🔨 Build EXE - NTZ Pro

on:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v3

      - name: 🐍 Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🛠️ Instalar flake8
        run: python -m pip install flake8

      - name: ✅ Executar flake8
        run: flake8 . --max-line-length=100

      - name: 🏗️ Compilar main.py com PyInstaller
        run: pyinstaller --onefile main.py

      - name: 📦 Compactar o executável
        run: |
          mkdir artifacts
          powershell Compress-Archive -Path dist/main.exe -DestinationPath artifacts/ntz-pro-exe.zip

      - name: 📤 Fazer upload do artefato manualmente
        run: |
          echo "Artefato gerado: artifacts/ntz-pro-exe.zip"
